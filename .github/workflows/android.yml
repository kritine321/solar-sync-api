name: build apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      project_dir:
        description: 'project root containing gradlew (use "." if root or "android" etc)'
        required: false
        default: '.'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      project_dir: ${{ github.event.inputs.project_dir || '.' }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up jdk
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: grant execute permission for gradlew (if present)
        run: |
          if [ -f "${project_dir}/gradlew" ]; then
            chmod +x "${project_dir}/gradlew"
          else
            echo "no gradlew found in ${project_dir}"
          fi

      - name: choose gradle command
        run: |
          if [ -f "${project_dir}/gradlew" ]; then
            echo "gradle_cmd=${project_dir}/gradlew" >> $github_env
          else
            echo "gradle_cmd=gradle" >> $github_env
          fi

      - name: build with gradle
        run: |
          cd "${project_dir}"
          $gradle_cmd assembledebug --no-daemon --stacktrace

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: solar-app-debug
          path: ${{ env.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
